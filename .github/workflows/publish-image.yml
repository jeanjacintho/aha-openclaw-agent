name: Publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aha-openclaw-agent
  # Admitted Plow slug, checked with `plow-agents image show aha`.
  PLOW_SLUG: aha
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # amd64 only: it is what Plow runs, and an emulated arm64 build multiplies the time.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PLOW_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Promotion to 1-click deploy stays a manual step for the owner.
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Promote to 1-click deploy:"
            echo
            echo '```'
            echo "plow-agents image promote ${PLOW_SLUG} ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
